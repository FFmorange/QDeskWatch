<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Darker cloud = heavier shower -->
  <circle cx="8.5" cy="7"   r="3"   fill="#8A8A8A"/>
  <circle cx="15"  cy="5.5" r="3.8" fill="#8A8A8A"/>
  <rect   x="5.5" y="7" width="13" height="5" rx="2.5" fill="#8A8A8A"/>
  <!-- 4 angled rain lines -->
  <g stroke="#85C1F5" stroke-width="1.5" stroke-linecap="round">
    <line x1="6"  y1="14" x2="4.5"  y2="19"/>
    <line x1="10" y1="14" x2="8.5"  y2="19"/>
    <line x1="14" y1="14" x2="12.5" y2="19"/>
    <line x1="18" y1="14" x2="16.5" y2="19"/>
  </g>
</svg>

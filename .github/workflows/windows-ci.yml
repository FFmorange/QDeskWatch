name: Windows CI

on:
  push:
    branches:
      - dev
      - release
  pull_request:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_VERSION: 6.8.3
  QT_ARCH: win64_msvc2022_64
  BUILD_CONFIG: Release

jobs:
  build-check:
    name: Windows Build Check
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/dev'
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: ${{ env.QT_ARCH }}
          cache: true

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_CONFIG }} --parallel

      - name: Run CTest if configured
        run: |
          if (Test-Path "build/CTestTestfile.cmake") {
            ctest --test-dir build -C $env:BUILD_CONFIG --output-on-failure
          } else {
            Write-Host "No CTest tests configured; skipping."
          }

      - name: Install
        run: cmake --install build --config ${{ env.BUILD_CONFIG }} --prefix install

      - name: Upload install artifact
        uses: actions/upload-artifact@v4
        with:
          name: iWatch-dev-build-${{ env.BUILD_CONFIG }}
          path: install
          if-no-files-found: error

  release-package:
    name: Windows Release Package
    if: github.ref == 'refs/heads/release'
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: ${{ env.QT_ARCH }}
          cache: true

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_CONFIG }} --parallel

      - name: Install
        run: cmake --install build --config ${{ env.BUILD_CONFIG }} --prefix install

      - name: Derive release tag from CMake version
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -match 'project\s*\(\s*[^\s]+\s+VERSION\s+([0-9]+(?:\.[0-9]+)+)') {
            $tag = "v$($Matches[1])"
            "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            throw "Could not determine project version from CMakeLists.txt"
          }

      - name: Archive release package
        run: |
          $archiveName = "iWatch-$env:RELEASE_TAG-windows.zip"
          if (Test-Path $archiveName) {
            Remove-Item -LiteralPath $archiveName -Force
          }
          Compress-Archive -Path "install/*" -DestinationPath $archiveName
          "ARCHIVE_NAME=$archiveName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: iWatch-${{ env.RELEASE_TAG }}-windows
          path: ${{ env.ARCHIVE_NAME }}
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ env.RELEASE_TAG }}"
          $asset = "${{ env.ARCHIVE_NAME }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists. Bump project version in CMakeLists.txt before releasing again."
          } else {
            gh release create $tag $asset --target release --title $tag --generate-notes
          }

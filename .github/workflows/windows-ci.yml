name: Windows CI

on:
  push:
    branches:
      - dev
      - release
  pull_request:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  QT_VERSION: 6.8.3
  QT_ARCH: win64_msvc2022_64
  BUILD_CONFIG: Release
  INSTALL_DIR: ${{ github.workspace }}/install

jobs:
  build-check:
    name: Windows Build Check
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/dev'
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Derive build version
        shell: pwsh
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -match 'project\s*\(\s*[^\s]+\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)') {
            $baseVersion = $Matches[1]
            $shortSha = $env:GITHUB_SHA.Substring(0, 7)
            if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
              $displayVersion = "$baseVersion-pr.$env:GITHUB_RUN_NUMBER+$shortSha"
            } else {
              $displayVersion = "$baseVersion-dev.$env:GITHUB_RUN_NUMBER+$shortSha"
            }
            $artifactVersion = $displayVersion -replace '[^0-9A-Za-z._-]', '-'
            "BASE_VERSION=$baseVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "APP_BUILD_VERSION=$displayVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "ARTIFACT_VERSION=$artifactVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            throw "Could not determine a three-part semantic version (for example 1.0.0) from CMakeLists.txt"
          }

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: ${{ env.QT_ARCH }}
          cache: true

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          -DAPP_BUILD_VERSION="${{ env.APP_BUILD_VERSION }}"

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_CONFIG }} --parallel

      - name: Run CTest if configured
        run: |
          if (Test-Path "build/CTestTestfile.cmake") {
            ctest --test-dir build -C $env:BUILD_CONFIG --output-on-failure
          } else {
            Write-Host "No CTest tests configured; skipping."
          }

      - name: Install
        run: cmake --install build --config ${{ env.BUILD_CONFIG }} --prefix "${{ env.INSTALL_DIR }}"

      - name: Upload install artifact
        uses: actions/upload-artifact@v4
        with:
          name: QDeskWatch-${{ env.ARTIFACT_VERSION }}-windows
          path: ${{ env.INSTALL_DIR }}
          if-no-files-found: error

  release-package:
    name: Windows Release Package
    if: github.ref == 'refs/heads/release'
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Derive release metadata
        shell: pwsh
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -match 'project\s*\(\s*[^\s]+\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)') {
            $version = $Matches[1]
            $tag = "v$version"
            $artifactVersion = $version -replace '[^0-9A-Za-z._-]', '-'
            "PROJECT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "APP_BUILD_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "ARTIFACT_VERSION=$artifactVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            throw "Could not determine a three-part semantic version (for example 1.0.0) from CMakeLists.txt"
          }

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: ${{ env.QT_ARCH }}
          cache: true

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          -DAPP_BUILD_VERSION="${{ env.APP_BUILD_VERSION }}"

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_CONFIG }} --parallel

      - name: Install
        run: cmake --install build --config ${{ env.BUILD_CONFIG }} --prefix "${{ env.INSTALL_DIR }}"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $installerName = "QDeskWatch-$env:RELEASE_TAG-windows-setup"
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe was not found at $iscc"
          }

          $args = @(
            "/DMyAppVersion=$env:PROJECT_VERSION",
            "/DMyAppSourceDir=$env:INSTALL_DIR",
            "/DMyInstallerOutputDir=$env:GITHUB_WORKSPACE",
            "/DMyInstallerBaseName=$installerName",
            "$env:GITHUB_WORKSPACE\packaging\windows\QDeskWatch.iss"
          )

          & $iscc $args
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE"
          }

          "SETUP_NAME=$installerName.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Archive release package
        run: |
          $archiveName = "QDeskWatch-$env:RELEASE_TAG-windows.zip"
          if (Test-Path $archiveName) {
            Remove-Item -LiteralPath $archiveName -Force
          }
          Compress-Archive -Path "$env:INSTALL_DIR/*" -DestinationPath $archiveName
          "ARCHIVE_NAME=$archiveName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: QDeskWatch-${{ env.RELEASE_TAG }}-windows
          path: ${{ env.ARCHIVE_NAME }}
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: QDeskWatch-${{ env.RELEASE_TAG }}-windows-setup
          path: ${{ env.SETUP_NAME }}
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ env.RELEASE_TAG }}"
          $zipAsset = "${{ env.ARCHIVE_NAME }}"
          $setupAsset = "${{ env.SETUP_NAME }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists. Bump project version in CMakeLists.txt before releasing again."
          } else {
            gh release create $tag $zipAsset $setupAsset --target release --title $tag --generate-notes
          }
